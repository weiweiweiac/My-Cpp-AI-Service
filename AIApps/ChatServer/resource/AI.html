<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 教练对话</title>
    <style>
        :root {
            --bg: #07110f;
            --panel: rgba(12, 24, 21, 0.94);
            --panel-soft: rgba(255, 255, 255, 0.06);
            --line: rgba(125, 255, 184, 0.22);
            --text: #ecfff6;
            --muted: #91a99d;
            --green: #7dffb8;
            --cyan: #26d9d0;
            --amber: #ffd166;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            color: var(--text);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background:
                linear-gradient(rgba(125, 255, 184, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(125, 255, 184, 0.035) 1px, transparent 1px),
                linear-gradient(135deg, #07110f 0%, #10231d 48%, #0a1417 100%);
            background-size: 34px 34px, 34px 34px, auto;
            overflow: hidden;
        }

        .session-list {
            width: 282px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--line);
            background: rgba(6, 17, 15, 0.92);
        }

        .session-list-header {
            padding: 22px;
            border-bottom: 1px solid var(--line);
        }

        .session-list-header strong {
            display: block;
            margin-bottom: 4px;
            font-size: 20px;
        }

        .session-list-header span {
            color: var(--muted);
            font-size: 13px;
        }

        .new-chat-btn {
            width: 100%;
            height: 42px;
            margin-top: 16px;
            border: 0;
            border-radius: 8px;
            color: #06110f;
            background: linear-gradient(90deg, var(--green), var(--cyan));
            cursor: pointer;
            font-weight: 800;
        }

        .session-list ul {
            flex: 1;
            margin: 0;
            padding: 10px;
            overflow-y: auto;
            list-style: none;
        }

        .session-list li {
            margin-bottom: 8px;
            padding: 12px;
            border: 1px solid transparent;
            border-radius: 8px;
            color: #d9fff0;
            background: rgba(255, 255, 255, 0.045);
            cursor: pointer;
            transition: border-color 0.18s, background 0.18s;
        }

        .session-list li.active {
            border-color: rgba(125, 255, 184, 0.55);
            background: rgba(125, 255, 184, 0.12);
        }

        .session-list li:hover {
            border-color: rgba(38, 217, 208, 0.5);
        }

        .chat-section {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--line);
            background: rgba(12, 24, 21, 0.9);
        }

        .top-title {
            min-width: 220px;
            margin-right: auto;
        }

        .top-title strong {
            display: block;
            font-size: 20px;
        }

        .top-title span {
            color: var(--muted);
            font-size: 13px;
        }

        .top-bar button,
        .top-bar select {
            height: 36px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .top-bar button {
            padding: 0 13px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.07);
        }

        .top-bar button:hover {
            border-color: rgba(125, 255, 184, 0.5);
        }

        .top-bar select {
            padding: 0 10px;
            color: var(--text);
            background: #10231d;
        }

        .model-label {
            color: var(--muted);
            white-space: nowrap;
            font-size: 14px;
        }

        .prompt-strip {
            display: flex;
            gap: 10px;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(125, 255, 184, 0.12);
            background: rgba(6, 17, 15, 0.62);
            overflow-x: auto;
        }

        .quick-prompt {
            flex: 0 0 auto;
            height: 34px;
            padding: 0 12px;
            border: 1px solid rgba(125, 255, 184, 0.3);
            border-radius: 999px;
            color: #d9fff0;
            background: rgba(125, 255, 184, 0.08);
            cursor: pointer;
            font-size: 13px;
        }

        .quick-prompt:hover {
            border-color: var(--green);
            color: var(--green);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: min(760px, 76%);
            padding: 14px 16px;
            border-radius: 8px;
            line-height: 1.65;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease;
        }

        .user {
            align-self: flex-end;
            color: #06110f;
            background: linear-gradient(135deg, var(--green), var(--cyan));
        }

        .assistant {
            align-self: flex-start;
            border: 1px solid rgba(255, 255, 255, 0.09);
            color: var(--text);
            background: var(--panel);
        }

        .input-box {
            display: flex;
            gap: 12px;
            padding: 16px 20px;
            border-top: 1px solid var(--line);
            background: rgba(12, 24, 21, 0.95);
        }

        textarea {
            flex: 1;
            min-height: 54px;
            max-height: 140px;
            resize: vertical;
            padding: 13px 14px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 8px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.07);
            outline: none;
            font-size: 15px;
            line-height: 1.5;
        }

        textarea:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(125, 255, 184, 0.14);
        }

        button[type="submit"] {
            width: 112px;
            border: 0;
            border-radius: 8px;
            color: #06110f;
            background: linear-gradient(90deg, var(--green), var(--cyan));
            cursor: pointer;
            font-weight: 800;
        }

        .tts-btn {
            flex: 0 0 auto;
            height: 30px;
            padding: 0 10px;
            border: 1px solid rgba(38, 217, 208, 0.42);
            border-radius: 8px;
            color: var(--cyan);
            background: rgba(38, 217, 208, 0.08);
            cursor: pointer;
            font-size: 12px;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: rgba(125, 255, 184, 0.26);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 860px) {
            body {
                flex-direction: column;
                overflow: auto;
            }

            .session-list {
                width: 100%;
                max-height: 210px;
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

            .top-bar {
                align-items: stretch;
                flex-wrap: wrap;
            }

            .top-title {
                min-width: 100%;
            }

            .message {
                max-width: 94%;
            }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.0/dist/purify.min.js"></script>
</head>
<body>
    <aside class="session-list">
        <div class="session-list-header">
            <strong>训练对话</strong>
            <span>按会话保存你的训练咨询记录</span>
            <button class="new-chat-btn" id="newChatBtn">开始新训练咨询</button>
        </div>
        <ul id="sessionList"></ul>
    </aside>

    <main class="chat-section">
        <div class="top-bar">
            <button class="back-btn" onclick="window.location.href='/menu'">返回控制台</button>
            <div class="top-title">
                <strong>AI 教练对话</strong>
                <span>输入训练目标、动作问题或饮食困惑</span>
            </div>
            <button class="sync-btn" id="sync-history-btn">同步历史</button>
            <label class="model-label" for="modelType">模型</label>
            <select id="modelType">
                <option value="1" selected>阿里百炼</option>
                <option value="2">豆包</option>
                <option value="3">百炼 RAG</option>
                <option value="4">阿里百炼 MCP</option>
            </select>
        </div>

        <div class="prompt-strip" aria-label="快捷健身问题">
            <button type="button" class="quick-prompt" data-prompt="我想减脂，每周能训练 3 次，请帮我生成一份入门训练计划。">减脂训练计划</button>
            <button type="button" class="quick-prompt" data-prompt="深蹲时膝盖和腰部应该注意什么？请用动作要点说明。">动作知识问答</button>
            <button type="button" class="quick-prompt" data-prompt="训练后应该怎么安排饮食和恢复？请给我简单可执行的建议。">饮食恢复建议</button>
            <button type="button" class="quick-prompt" data-prompt="我今天只有 30 分钟，请安排一次全身训练。">30 分钟训练</button>
        </div>

        <div class="chat-container" id="chat-container"></div>

        <form class="input-box" id="chat-form">
            <textarea id="question" placeholder="例如：我想增肌，每周训练 4 次，有哑铃和卧推凳，请帮我安排计划。" required></textarea>
            <button type="submit">发送</button>
        </form>
    </main>

    <script>
        let currentSessionId = null, tempSession = false;
        const sessions = {};
        const sessionList = document.getElementById('sessionList');
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const questionInput = document.getElementById('question');
        const syncBtn = document.getElementById('sync-history-btn');
        const modelTypeSelect = document.getElementById('modelType');
        const newChatBtn = document.getElementById('newChatBtn');

        async function playTTS(text) {
            try {
                const res = await fetch('/chat/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
                const data = await res.json();
                if (data.success && data.url) { const audio = new Audio(data.url); audio.play(); }
                else alert('[错误] 无法获取语音');
            } catch (err) { console.error(err); alert('[错误] 请求语音接口失败'); }
        }

        function appendMessage(role, content) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', role);
            const safeHtml = DOMPurify.sanitize(marked.parse(content));
            const escapedContent = content.replace(/`/g, '\\`').replace(/\$/g, '\\$');
            msgDiv.innerHTML = `<div style="display:flex; align-items:flex-start; gap:10px;"><div style="flex:1;"><b>${role === 'user' ? '你' : 'AI 教练'}:</b><br>${safeHtml}</div><button class="tts-btn" onclick="playTTS(\`${escapedContent}\`)">朗读</button></div>`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function updateMessageContent(msgDiv, role, content) {
            const text = content || '';
            const safeHtml = DOMPurify.sanitize(marked.parse(text));
            const escapedContent = text.replace(/`/g, '\\`').replace(/\$/g, '\\$');
            const label = role === 'user' ? 'You' : 'AI Coach';
            msgDiv.innerHTML = `<div style="display:flex; align-items:flex-start; gap:10px;"><div style="flex:1;"><b>${label}:</b><br>${safeHtml}</div><button class="tts-btn" onclick="playTTS(\`${escapedContent}\`)">Play</button></div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function clearMessages() { chatContainer.innerHTML = ''; }

        function renderSessionList() {
            sessionList.innerHTML = '';
            for (let id in sessions) {
                const li = document.createElement('li');
                li.textContent = sessions[id].name || `训练咨询 ${id}`;
                li.dataset.id = id;
                if (id === currentSessionId) li.classList.add('active');
                li.onclick = () => switchSession(id);
                sessionList.appendChild(li);
            }
        }

        async function switchSession(id) {
            currentSessionId = String(id); tempSession = false; clearMessages();
            if (!sessions[id].messages || sessions[id].messages.length === 0) {
                try {
                    const res = await fetch('/chat/history', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: currentSessionId }) });
                    const data = await res.json();
                    if (data.success && Array.isArray(data.history)) {
                        sessions[id].messages = [];
                        data.history.forEach(item => { sessions[id].messages.push({ role: item.is_user ? 'user' : 'assistant', content: item.content }); });
                    }
                } catch (err) { console.error('获取历史失败', err); }
            }
            sessions[id].messages.forEach(m => appendMessage(m.role, m.content));
            renderSessionList();
        }

        newChatBtn.addEventListener('click', () => {
            currentSessionId = 'temp';
            tempSession = true;
            clearMessages();
            questionInput.focus();
        });

        document.querySelectorAll('.quick-prompt').forEach(btn => {
            btn.addEventListener('click', () => {
                questionInput.value = btn.dataset.prompt;
                questionInput.focus();
            });
        });

        function parseSseBlock(block) {
            let eventName = 'message';
            const dataLines = [];
            block.split(/\r?\n/).forEach(line => {
                if (line.startsWith('event:')) {
                    eventName = line.slice(6).trim();
                } else if (line.startsWith('data:')) {
                    dataLines.push(line.slice(5).trimStart());
                }
            });
            return { event: eventName, data: dataLines.join('\n') };
        }

        async function readSseStream(response, handlers) {
            if (!response.ok || !response.body) {
                throw new Error('stream endpoint unavailable');
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                buffer = buffer.replace(/\r\n/g, '\n');
                let boundary = buffer.indexOf('\n\n');
                while (boundary !== -1) {
                    const block = buffer.slice(0, boundary);
                    buffer = buffer.slice(boundary + 2);
                    if (block.trim()) {
                        const evt = parseSseBlock(block);
                        let payload = {};
                        try {
                            payload = JSON.parse(evt.data);
                        } catch (err) {
                            payload = { content: evt.data, message: evt.data };
                        }

                        if (handlers[evt.event]) {
                            handlers[evt.event](payload);
                        }
                        if (evt.event === 'done') {
                            return;
                        }
                    }
                    boundary = buffer.indexOf('\n\n');
                }
            }
        }

        async function sendStreamMessage(question) {
            appendMessage('assistant', '');
            const assistantDiv = chatContainer.lastElementChild;
            let answer = '';
            let streamError = '';

            const response = await fetch('/chat/send-stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question, modelType: modelTypeSelect.value, sessionId: currentSessionId })
            });

            await readSseStream(response, {
                message(payload) {
                    answer += payload.content || '';
                    updateMessageContent(assistantDiv, 'assistant', answer);
                },
                status(payload) {
                    if (!answer) {
                        updateMessageContent(assistantDiv, 'assistant', payload.message || 'Generating...');
                    }
                },
                error(payload) {
                    streamError = payload.message || 'stream error';
                    updateMessageContent(assistantDiv, 'assistant', '[Error] ' + streamError);
                }
            });

            return { success: !streamError, content: answer, message: streamError };
        }

        chatForm.addEventListener('submit', async e => {
            e.preventDefault();
            const question = questionInput.value.trim();
            if (!question) return;

            if (!currentSessionId) {
                currentSessionId = 'temp';
                tempSession = true;
            }

            appendMessage('user', question);

            if (tempSession) {
                try {
                    const response = await fetch('/chat/send-new-session', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question, modelType: modelTypeSelect.value })
                    });
                    const data = await response.json();
                    if (data.success) {
                        const sessionId = String(data.sessionId);
                        sessions[sessionId] = {
                            name: '训练咨询',
                            messages: [
                                { role: 'user', content: question },
                                { role: 'assistant', content: data.Information }
                            ]
                        };
                        currentSessionId = sessionId;
                        tempSession = false;
                        renderSessionList();
                        appendMessage('assistant', data.Information);
                    } else {
                        appendMessage('assistant', '[错误] ' + (data.message || '未知错误'));
                    }
                } catch (err) {
                    console.error(err);
                    appendMessage('assistant', '[错误] 无法连接到服务器');
                }
            } else {
                sessions[currentSessionId].messages.push({ role: 'user', content: question });
                try {
                    try {
                        const streamed = await sendStreamMessage(question);
                        if (streamed.success) {
                            sessions[currentSessionId].messages.push({ role: 'assistant', content: streamed.content });
                            questionInput.value = '';
                            return;
                        }
                        questionInput.value = '';
                        return;
                    } catch (streamErr) {
                        console.warn('stream failed, falling back to sync chat', streamErr);
                    }

                    const response = await fetch('/chat/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question, modelType: modelTypeSelect.value, sessionId: currentSessionId })
                    });
                    const data = await response.json();
                    if (data.success) {
                        appendMessage('assistant', data.Information);
                        sessions[currentSessionId].messages.push({ role: 'assistant', content: data.Information });
                    } else {
                        appendMessage('assistant', '[错误] ' + (data.message || '未知错误'));
                    }
                } catch (err) {
                    console.error(err);
                    appendMessage('assistant', '[错误] 无法连接到服务器');
                }
            }

            questionInput.value = '';
        });

        syncBtn.addEventListener('click', async () => {
            if (!currentSessionId || tempSession) {
                alert('请选择已有训练咨询进行同步');
                return;
            }
            try {
                const res = await fetch('/chat/history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId: currentSessionId })
                });
                const data = await res.json();
                if (data.success && Array.isArray(data.history)) {
                    sessions[currentSessionId].messages = [];
                    clearMessages();
                    data.history.forEach(item => {
                        appendMessage(item.is_user ? 'user' : 'assistant', item.content);
                        sessions[currentSessionId].messages.push({ role: item.is_user ? 'user' : 'assistant', content: item.content });
                    });
                } else {
                    alert('[错误] 无法获取历史数据');
                }
            } catch (err) {
                console.error(err);
                alert('[错误] 请求历史数据失败');
            }
        });

        async function loadSessions() {
            try {
                const res = await fetch('/chat/sessions');
                const data = await res.json();
                if (data.success && Array.isArray(data.sessions)) {
                    data.sessions.forEach(s => {
                        const sid = String(s.sessionId);
                        sessions[sid] = { name: s.name || `训练咨询 ${sid}`, messages: [] };
                    });
                    renderSessionList();
                }
            } catch (err) {
                console.error('获取会话列表失败', err);
            }
        }

        loadSessions();
    </script>
</body>
</html>
